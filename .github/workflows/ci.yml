name: Data Insight CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  # ─── Backend Tests ──────────────────────────────────────────────────────────
  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        working-directory: ./backend
        run: flake8 app/ --max-line-length=120 --ignore=E501,W503

      - name: Run tests with pytest
        working-directory: ./backend
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci-minimum-32-characters
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          OPENAI_API_KEY: placeholder
          ANTHROPIC_API_KEY: placeholder
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/ -v --tb=short

  # ─── Frontend Lint & Build Check ────────────────────────────────────────────
  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: TypeScript type check
        working-directory: ./frontend
        run: npx tsc --noEmit

  # ─── Docker Build Check ──────────────────────────────────────────────────────
  docker:
    name: Docker — Build Verification
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f ./backend/Dockerfile.dev ./backend

      - name: Build frontend image
        run: docker build -f ./frontend/Dockerfile.dev ./frontend
