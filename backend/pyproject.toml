[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff.lint]
ignore = ["E501", "T201", "PLC0415", "ANN", "PLR2004", "PERF203", "BLE001", "S110", "EXE002", "F401", "F841", "E712", "E226", "F811", "W291", "W293", "F821"]